<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  <!-- Google model-viewer web component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background-color: #f4f4f9; height: 100vh; display: flex; justify-content: center; align-items: center; }
    model-viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <!-- Replace 'your-file-name.glb' with your exact GLB file name -->
  <model-viewer 
    src="your-file-name.glb" 
    alt="3D Model" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
